<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Zaatar Factory End Card</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,800&family=Inter:wght@400;500;600;700&display=block" rel="stylesheet">
<style>
  /* Variant + size come from the query string: ?v=hero|catering&w=1080&h=1920 */
  :root {
    --green-deep: #24401a;
    --green: #3d6b25;
    --gold: #e9c25d;
    --gold-soft: #f3dc9a;
    --cream: #fbf5e6;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: var(--green-deep); }
  .card {
    position: relative; overflow: hidden;
    background:
      radial-gradient(120% 70% at 50% 30%, rgba(233,194,93,0.10), transparent 60%),
      radial-gradient(90% 60% at 50% 110%, rgba(0,0,0,0.35), transparent 70%),
      linear-gradient(180deg, var(--green) 0%, var(--green-deep) 100%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center;
  }
  /* Fine grain so the flat green doesn't band after H.264 compression */
  .card::after {
    content: ""; position: absolute; inset: 0; opacity: .07; pointer-events: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }
  .safe { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }

  /* Rolling-pin wordmark, rebuilt from the flyer's motif (placeholder until the real logo file arrives) */
  .pin { display: flex; align-items: center; }
  .handle { background: var(--gold); border-radius: 999px; position: relative; }
  .handle::after { content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    background: var(--green-deep); border-radius: 50%; }
  .barrel { background: var(--gold); color: var(--green-deep); border-radius: 28px;
    display: flex; flex-direction: column; align-items: center; }
  .the { font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; line-height: 1; }
  .name { font-family: 'Fraunces', serif; font-weight: 800; letter-spacing: .02em; line-height: .95; white-space: nowrap; }
  .bakery { font-family: 'Fraunces', serif; font-weight: 700; font-style: italic; line-height: 1; }

  .slogan { font-family: 'Fraunces', serif; font-weight: 800; color: var(--gold); letter-spacing: .06em; line-height: 1; }
  .rule { background: var(--gold); opacity: .55; }
  .info { font-weight: 600; line-height: 1.35; }
  .info .big { font-weight: 700; color: var(--cream); letter-spacing: .01em; }
  .info .muted { color: var(--gold-soft); font-weight: 500; }
  .tag { background: var(--gold); color: var(--green-deep); font-weight: 700; border-radius: 999px;
    letter-spacing: .08em; text-transform: uppercase; }
  .handles { display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .handles svg { fill: var(--gold); }
  .eyebrow { font-weight: 700; color: var(--gold); letter-spacing: .22em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="card" id="card">
  <div class="safe" id="safe">
    <div class="eyebrow" id="eyebrow"></div>
    <div class="pin">
      <div class="handle" id="hl"></div>
      <div class="barrel" id="barrel">
        <div class="the" id="the">The</div>
        <div class="name" id="name">ZAATAR FACTORY</div>
        <div class="bakery" id="bakery">&amp; Bakery</div>
      </div>
      <div class="handle" id="hr"></div>
    </div>
    <div class="slogan" id="slogan">WE BAKE SMILES</div>
    <div class="rule" id="rule"></div>
    <div class="info" id="info">
      <div class="big" id="phone">(818) 859-7353</div>
      <div id="addr1">2909 N Glenoaks Blvd</div>
      <div id="addr2">Burbank, CA 91504</div>
      <div class="muted" id="web">zaatarfactory.com</div>
    </div>
    <div class="handles" id="handles">
      <svg viewBox="0 0 24 24" id="ig"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 1.2.1 1.8.2 2.2.4.6.2 1 .5 1.4.9.4.4.7.8.9 1.4.2.4.4 1.1.4 2.2.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 1.2-.2 1.8-.4 2.2-.2.6-.5 1-.9 1.4-.4.4-.8.7-1.4.9-.4.2-1.1.4-2.2.4-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-1.2-.1-1.8-.2-2.2-.4-.6-.2-1-.5-1.4-.9-.4-.4-.7-.8-.9-1.4-.2-.4-.4-1.1-.4-2.2C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8c.1-1.2.2-1.8.4-2.2.2-.6.5-1 .9-1.4.4-.4.8-.7 1.4-.9.4-.2 1.1-.4 2.2-.4C8.4 2.2 8.8 2.2 12 2.2zm0 4.7a5.1 5.1 0 100 10.2 5.1 5.1 0 000-10.2zm0 8.4a3.3 3.3 0 110-6.6 3.3 3.3 0 010 6.6zm5.3-9.8a1.2 1.2 0 100 2.4 1.2 1.2 0 000-2.4z"/></svg>
      <svg viewBox="0 0 24 24" id="tt"><path d="M16.6 2h-3.3v13.2a2.9 2.9 0 11-2.9-2.9c.3 0 .6 0 .9.1V9a6.3 6.3 0 105.3 6.2V8.6a7.9 7.9 0 004.6 1.5V6.7a4.6 4.6 0 01-4.6-4.7z"/></svg>
      <span id="handle">@zaatarfactory</span>
    </div>
    <div class="tag" id="tag">Catering &amp; Party Platters Available</div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const v = q.get('v') || 'hero';
  const W = +q.get('w') || 1080, H = +q.get('h') || 1920;
  const card = document.getElementById('card');
  card.style.width = W + 'px'; card.style.height = H + 'px';

  // Scale unit: based on width, capped for wide formats so text doesn't balloon.
  const u = H / W > 1 ? W / 1080 : H / 1080 * 0.95;
  const px = n => Math.round(n * u) + 'px';
  const $ = id => document.getElementById(id);

  // Keep everything inside TikTok/Reels safe area: top 220, bottom 480, right 160 (9:16).
  const tall = H / W > 1.5;
  card.style.paddingTop = tall ? px(220) : px(60);
  card.style.paddingBottom = tall ? px(480) : px(60);
  card.style.paddingLeft = px(80);
  card.style.paddingRight = tall ? px(160) : px(80);

  // Wordmark
  $('barrel').style.padding = `${px(26)} ${px(46)} ${px(22)}`;
  $('the').style.fontSize = px(42);
  $('name').style.fontSize = px(78);
  $('bakery').style.fontSize = px(42);
  $('bakery').style.alignSelf = 'flex-end';
  $('the').style.alignSelf = 'flex-start';
  for (const id of ['hl', 'hr']) {
    $(id).style.width = px(56); $(id).style.height = px(56);
    $(id).style.margin = `0 ${px(-6)}`;
  }
  document.head.insertAdjacentHTML('beforeend',
    `<style>.handle::after{width:${px(16)};height:${px(16)};}</style>`);

  $('slogan').style.fontSize = px(76);
  $('slogan').style.marginTop = px(56);
  $('rule').style.width = px(120); $('rule').style.height = px(3);
  $('rule').style.margin = `${px(44)} 0 ${px(40)}`;
  $('info').style.fontSize = px(38);
  $('phone').style.fontSize = px(56);
  $('phone').style.marginBottom = px(12);
  $('web').style.marginTop = px(10);
  $('handles').style.fontSize = px(38);
  $('handles').style.marginTop = px(34);
  $('handles').style.gap = px(14);
  for (const id of ['ig', 'tt']) { $(id).style.width = px(40); $(id).style.height = px(40); }
  $('tag').style.fontSize = px(26);
  $('tag').style.padding = `${px(16)} ${px(32)}`;
  $('tag').style.marginTop = px(46);
  $('eyebrow').style.fontSize = px(30);

  if (v === 'catering') {
    $('eyebrow').textContent = 'Catering & Party Platters';
    $('eyebrow').style.marginBottom = px(44);
    $('slogan').textContent = 'WE BAKE SMILES';
    $('tag').textContent = 'Order: (818) 859-7353';
    $('phone').style.display = 'none';
  } else {
    $('eyebrow').style.display = 'none';
  }
  if (!tall) { // 4:5 and 16:9: tighten vertical rhythm
    $('slogan').style.marginTop = px(36);
    $('rule').style.margin = `${px(28)} 0 ${px(26)}`;
    $('handles').style.marginTop = px(22);
    $('tag').style.marginTop = px(30);
  }
  document.fonts.ready.then(() => document.body.dataset.ready = '1');
</script>
</body>
</html>
